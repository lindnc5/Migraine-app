<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Migraine">
<meta name="theme-color" content="#f6f5f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Migraine Log</title>
<style>
  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #8a8a8e;
    --line: #e6e4df;
    --migraine: #d93a3a;
    --zolmi: #c98500;
    --advil: #1f7ae0;
    --today: #1d1d1f;
    --sel: #f1efe9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000; --card: #1c1c1e; --text: #f2f2f7; --muted: #8e8e93;
      --line: #2c2c2e; --today: #f2f2f7; --sel: #2c2c2e;
      --migraine: #d03a34; --zolmi: #bd8a12; --advil: #3d8bf0;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  .wrap { max-width: 480px; margin: 0 auto; padding: 12px 14px calc(96px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  /* Month header */
  .month-head { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 10px; }
  .month-head h1 { font-size: 22px; margin: 0; font-weight: 700; }
  .nav { display: flex; gap: 6px; align-items: center; }
  .nav button { width: 38px; height: 38px; border-radius: 19px; background: var(--card); font-size: 20px;
    display: grid; place-items: center; }
  .nav .today-btn { width: auto; padding: 0 14px; font-size: 15px; font-weight: 600; }

  /* Calendar */
  .cal { background: var(--card); border-radius: 16px; padding: 8px 6px 6px; }
  .dow, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .dow div { text-align: center; font-size: 12px; color: var(--muted); font-weight: 600; padding: 2px 0 6px; }
  .day { aspect-ratio: 1 / 0.74; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 5px 0 0; min-width: 0; border-radius: 10px; position: relative; }
  .day.empty { visibility: hidden; }
  .day .n { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 14px; font-size: 15px; }
  .day.is-today .n { background: var(--today); color: var(--bg); font-weight: 700; }
  .day.is-sel { background: var(--sel); }
  .day.mig { background: color-mix(in srgb, var(--migraine) 14%, transparent); }
  .day.mig.is-sel { background: color-mix(in srgb, var(--migraine) 26%, transparent); }
  .dots { display: flex; gap: 3px; margin-top: 4px; height: 7px; }
  .dot { width: 7px; height: 7px; border-radius: 4px; }
  .dot.migraine { background: var(--migraine); }
  .dot.zolmi { background: var(--zolmi); }
  .dot.advil { background: var(--advil); }

  .legend { display: flex; justify-content: center; gap: 14px; font-size: 13px; color: var(--muted); margin: 10px 0 0; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .summary { text-align: center; font-size: 13px; color: var(--muted); margin-top: 4px; }

  /* Selected day */
  .day-title { font-size: 18px; font-weight: 700; margin: 14px 2px 10px; }

  /* Big buttons */
  .btns { display: grid; gap: 10px; }
  .big { width: 100%; padding: 16px 18px; border-radius: 16px; color: #fff; font-size: 20px; font-weight: 700;
    display: flex; align-items: center; justify-content: space-between; transition: transform .08s, filter .08s; }
  .big:active { transform: scale(0.98); filter: brightness(0.9); }
  .big small { font-size: 13px; font-weight: 500; opacity: .85; }
  .big.migraine { background: var(--migraine); }
  .big.zolmi { background: var(--zolmi); }
  .big.advil { background: var(--advil); }

  /* Entries */
  .entries { margin-top: 14px; background: var(--card); border-radius: 16px; overflow: hidden; }
  .entry { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-top: 1px solid var(--line); }
  .entry:first-child { border-top: 0; }
  .entry .what { flex: 1; font-weight: 600; }
  .entry .time { color: var(--muted); font-variant-numeric: tabular-nums; }
  .entry { width: 100%; text-align: left; }
  .entry:active { background: var(--sel); }
  .entry .what { display: flex; flex-direction: column; min-width: 0; }
  .entry .note { font-weight: 400; font-size: 14px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 2px; }
  .entry .chev { color: var(--muted); font-size: 20px; line-height: 1; }
  .none { padding: 16px; color: var(--muted); text-align: center; }

  .footer { text-align: center; margin-top: 26px; }
  .footer button { color: var(--muted); font-size: 14px; text-decoration: underline; padding: 6px 10px; }

  /* Toast */
  .toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom)); transform: translate(-50%, 0); opacity: 0; pointer-events: none;
    background: #1d1d1f; color: #fff; padding: 12px 14px 12px 18px; border-radius: 14px; display: flex; gap: 14px;
    align-items: center; box-shadow: 0 6px 24px rgba(0,0,0,.25); transition: opacity .2s; max-width: 92vw; z-index: 10; }
  .toast.show { opacity: 1; pointer-events: auto; }
  .toast button { color: #8ec5ff; font-weight: 700; }

  /* Sheet (for past-day time + backup) */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: flex-end; justify-content: center; z-index: 20; }
  .sheet-bg.show { display: flex; }
  .sheet { background: var(--card); width: 100%; max-width: 480px; border-radius: 18px 18px 0 0;
    padding: 20px 18px calc(22px + env(safe-area-inset-bottom)); }
  .sheet h2 { margin: 0 0 14px; font-size: 19px; }
  .sheet p { color: var(--muted); margin: 0 0 14px; font-size: 14px; }
  .sheet input[type=time] { font: inherit; font-size: 22px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line);
    width: 100%; background: var(--bg); color: var(--text); margin-bottom: 14px; }
  .sheet label { display: block; font-size: 14px; color: var(--muted); margin: 0 0 6px; }
  .sheet textarea { font: inherit; font-size: 17px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line);
    width: 100%; min-height: 90px; resize: vertical; background: var(--bg); color: var(--text); margin-bottom: 14px; }
  .sheet .danger { color: var(--migraine); background: none; width: 100%; padding: 14px; font-weight: 600; margin-top: 6px; }
  .sheet .row { display: flex; gap: 10px; }
  .sheet .row button, .sheet .wide { flex: 1; padding: 14px; border-radius: 12px; font-weight: 600; background: var(--sel); }
  .sheet .row .primary { background: var(--text); color: var(--bg); }
  .sheet .wide { width: 100%; margin-bottom: 10px; display: block; }

  /* Tab bar */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center;
    background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--line); padding: 6px 0 calc(6px + env(safe-area-inset-bottom)); }
  .tabbar button { flex: 0 1 200px; display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: 12px; font-weight: 600; color: var(--muted); padding: 4px 0; }
  .tabbar svg { width: 26px; height: 26px; }
  .tabbar button.on { color: var(--text); }
  [hidden] { display: none !important; }

  /* Summary */
  .seg { display: flex; background: var(--card); border-radius: 12px; padding: 3px; margin: 4px 0 12px; }
  .seg button { flex: 1; padding: 8px 0; border-radius: 9px; font-size: 14px; font-weight: 600; color: var(--muted); }
  .seg button.on { background: var(--text); color: var(--bg); }
  .period { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .period h2 { margin: 0; font-size: 18px; }
  .period button { width: 36px; height: 36px; border-radius: 18px; background: var(--card); font-size: 20px; }
  .period button:disabled { opacity: .3; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tile { background: var(--card); border-radius: 14px; padding: 12px 10px; }
  .tile .k { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .tile .v { font-size: 30px; font-weight: 700; line-height: 1.1; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tile .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .card { background: var(--card); border-radius: 14px; padding: 14px; margin-top: 10px; }
  .card h3 { margin: 0 0 10px; font-size: 15px; }
  .facts { display: grid; gap: 8px; }
  .fact { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; }
  .fact span:last-child { font-weight: 600; text-align: right; }
  .warn { margin-top: 10px; font-size: 14px; padding: 10px 12px; border-radius: 10px; background: var(--sel); }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 120px; border-bottom: 1px solid var(--line); }
  .bars .col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
  .bars .b { width: 70%; max-width: 22px; background: var(--migraine); border-radius: 4px 4px 0 0; min-height: 0; }
  .bars .col.dim .b { opacity: .35; }
  .bars .col.picked .b { opacity: 1; }
  .bars .lab { font-size: 11px; font-weight: 600; margin-bottom: 3px; font-variant-numeric: tabular-nums; }
  .xlabels { display: flex; gap: 2px; }
  .xlabels div { flex: 1; text-align: center; font-size: 11px; color: var(--muted); padding-top: 4px; }
  .chart-cap { font-size: 13px; color: var(--muted); margin: -4px 0 10px; min-height: 18px; }
  .hrow { display: grid; grid-template-columns: 86px 1fr 28px; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 8px; }
  .hrow .track { height: 10px; background: var(--sel); border-radius: 5px; overflow: hidden; }
  .hrow .fill { height: 100%; background: var(--migraine); border-radius: 5px; }
  .hrow span:last-child { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .note-item { padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .note-item:first-of-type { border-top: 0; padding-top: 0; }
  .note-item .meta { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; margin-bottom: 2px; }
  .note-item .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
  .share { width: 100%; margin-top: 14px; padding: 14px; border-radius: 14px; background: var(--text); color: var(--bg); font-weight: 700; }
  .muted { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<div class="wrap" id="logView">
  <div class="month-head">
    <h1 id="monthLabel"></h1>
    <div class="nav">
      <button id="prev" aria-label="Previous month">‹</button>
      <button id="todayBtn" class="today-btn">Today</button>
      <button id="next" aria-label="Next month">›</button>
    </div>
  </div>

  <div class="cal">
    <div class="dow"><div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div></div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="legend">
    <span><i class="dot migraine"></i>Migraine</span>
    <span><i class="dot zolmi"></i>Zolmitriptan</span>
    <span><i class="dot advil"></i>Advil</span>
  </div>
  <div class="summary" id="summary"></div>

  <div class="day-title" id="dayTitle"></div>
  <div class="btns">
    <button class="big migraine" data-type="migraine">Migraine <small id="hint1"></small></button>
    <button class="big zolmi" data-type="zolmi">Zolmitriptan <small id="hint2"></small></button>
    <button class="big advil" data-type="advil">Advil <small id="hint3"></small></button>
  </div>

  <div class="entries" id="entries"></div>

  <div class="footer"><button id="backupBtn">Backup / Restore</button></div>
</div>

<div class="wrap" id="summaryView" hidden>
  <div class="month-head"><h1>Summary</h1></div>
  <div class="seg" id="rangeSeg">
    <button data-r="1" class="on">Month</button><button data-r="3">3 Months</button><button data-r="12">Year</button>
  </div>
  <div class="period">
    <button id="sPrev" aria-label="Earlier">‹</button>
    <h2 id="sLabel"></h2>
    <button id="sNext" aria-label="Later">›</button>
  </div>

  <div class="tiles">
    <div class="tile"><div class="k"><i class="dot migraine"></i>Migraine</div><div class="v" id="tMig"></div><div class="s" id="tMigS"></div></div>
    <div class="tile"><div class="k"><i class="dot zolmi"></i>Zolmitriptan</div><div class="v" id="tZol"></div><div class="s" id="tZolS"></div></div>
    <div class="tile"><div class="k"><i class="dot advil"></i>Advil</div><div class="v" id="tAdv"></div><div class="s" id="tAdvS"></div></div>
  </div>
  <div id="warnBox"></div>

  <div class="card">
    <h3>At a glance</h3>
    <div class="facts" id="facts"></div>
  </div>

  <div class="card">
    <h3>Migraine days per month</h3>
    <div class="chart-cap" id="barCap">Tap a bar for details</div>
    <div class="bars" id="bars"></div>
    <div class="xlabels" id="xlabels"></div>
  </div>

  <div class="card">
    <h3>When migraines start</h3>
    <div id="tod"></div>
  </div>

  <div class="card">
    <h3>Notes</h3>
    <div id="notesList"></div>
  </div>

  <button class="share" id="shareBtn">Share summary (for your doctor)</button>
</div>

<nav class="tabbar">
  <button id="tabLog" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
    Log
  </button>
  <button id="tabSummary">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V13M12 20V6M19 20v-9"/></svg>
    Summary
  </button>
</nav>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="undoBtn">Undo</button></div>

<!-- Pick a time when logging on a day other than today -->
<div class="sheet-bg" id="timeSheet">
  <div class="sheet">
    <h2 id="timeTitle"></h2>
    <p>What time was it?</p>
    <input type="time" id="timeInput">
    <div class="row">
      <button id="timeCancel">Cancel</button>
      <button id="timeSave" class="primary">Save</button>
    </div>
  </div>
</div>

<!-- Edit a logged entry -->
<div class="sheet-bg" id="editSheet">
  <div class="sheet">
    <h2 id="editTitle"></h2>
    <label for="editTime">Time</label>
    <input type="time" id="editTime">
    <label for="editNote">Note</label>
    <textarea id="editNote" placeholder="e.g. woke up with it, pain 7/10, took with food…"></textarea>
    <div class="row">
      <button id="editCancel">Cancel</button>
      <button id="editSave" class="primary">Save</button>
    </div>
    <button id="editDelete" class="danger">Delete this entry</button>
  </div>
</div>

<!-- Backup / restore -->
<div class="sheet-bg" id="backupSheet">
  <div class="sheet">
    <h2>Backup / Restore</h2>
    <p>Your log is saved only on this phone. Make a backup now and then so you don't lose it.</p>
    <button class="wide" id="exportBtn">Save backup file</button>
    <button class="wide" id="importBtn">Restore from backup file</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
    <button class="wide" id="backupClose">Close</button>
  </div>
</div>

<script>
(() => {
  const KEY = 'migraine-log-v1';
  const TYPES = {
    migraine: { label: 'Migraine' },
    zolmi:    { label: 'Zolmitriptan' },
    advil:    { label: 'Advil' },
  };
  const ORDER = ['migraine', 'zolmi', 'advil'];

  // ---------- storage ----------
  // Each entry: { id, type, t }  where t = ISO timestamp (local time is derived on display)
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(entries)); }
  let entries = load();

  // Ask iOS not to evict our data.
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  // ---------- date helpers ----------
  const pad = n => String(n).padStart(2, '0');
  const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const sameDay = (a, b) => dayKey(a) === dayKey(b);
  const fmtTime = d => d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

  function byDay() {
    const map = {};
    for (const e of entries) {
      const k = dayKey(new Date(e.t));
      (map[k] ||= []).push(e);
    }
    return map;
  }

  // ---------- state ----------
  let selected = new Date();
  let viewYear = selected.getFullYear();
  let viewMonth = selected.getMonth();

  const $ = id => document.getElementById(id);

  // ---------- render ----------
  function render() {
    if (!$('summaryView').hidden) renderSummary();
    const today = new Date();
    const map = byDay();

    const first = new Date(viewYear, viewMonth, 1);
    $('monthLabel').textContent = first.toLocaleDateString([], { month: 'long', year: 'numeric' });

    const grid = $('grid');
    grid.innerHTML = '';
    const lead = first.getDay();
    const daysIn = new Date(viewYear, viewMonth + 1, 0).getDate();
    for (let i = 0; i < lead; i++) {
      const c = document.createElement('div'); c.className = 'day empty'; grid.appendChild(c);
    }
    const monthCounts = { migraine: 0, zolmi: 0, advil: 0 };
    for (let d = 1; d <= daysIn; d++) {
      const date = new Date(viewYear, viewMonth, d);
      const list = map[dayKey(date)] || [];
      const has = new Set(list.map(e => e.type));
      has.forEach(t => monthCounts[t]++);

      const cell = document.createElement('button');
      cell.className = 'day';
      if (sameDay(date, today)) cell.classList.add('is-today');
      if (sameDay(date, selected)) cell.classList.add('is-sel');
      if (has.has('migraine')) cell.classList.add('mig');
      cell.innerHTML = `<span class="n">${d}</span><span class="dots">${
        ORDER.filter(t => has.has(t)).map(t => `<i class="dot ${t}"></i>`).join('')}</span>`;
      cell.onclick = () => { selected = date; render(); };
      grid.appendChild(cell);
    }

    const plural = (n, w) => `${n} ${w} day${n === 1 ? '' : 's'}`;
    $('summary').textContent =
      `${plural(monthCounts.migraine, 'migraine')} · ${plural(monthCounts.zolmi, 'Zolmitriptan')} · ${plural(monthCounts.advil, 'Advil')}`;

    // Selected day
    const isToday = sameDay(selected, today);
    $('dayTitle').textContent = isToday
      ? 'Today, ' + selected.toLocaleDateString([], { month: 'long', day: 'numeric' })
      : selected.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
    const hint = isToday ? 'tap to log now' : 'tap to add';
    $('hint1').textContent = $('hint2').textContent = $('hint3').textContent = hint;

    const list = (map[dayKey(selected)] || []).slice().sort((a, b) => a.t.localeCompare(b.t));
    const box = $('entries');
    if (!list.length) {
      box.innerHTML = `<div class="none">Nothing logged ${isToday ? 'today' : 'this day'}</div>`;
    } else {
      box.innerHTML = '';
      for (const e of list) {
        const row = document.createElement('button');
        row.className = 'entry';
        row.innerHTML = `<i class="dot ${e.type}"></i><span class="what">${TYPES[e.type].label}${
            e.note ? `<span class="note">${escapeHtml(e.note)}</span>` : ''}</span>
          <span class="time">${fmtTime(new Date(e.t))}</span><span class="chev">›</span>`;
        row.onclick = () => openEdit(e.id);
        box.appendChild(row);
      }
    }
  }

  // ---------- logging ----------
  let lastAdded = null, toastTimer = null;
  function addEntry(type, when) {
    const e = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), type, t: when.toISOString() };
    entries.push(e); save();
    lastAdded = e.id;
    if (navigator.vibrate) navigator.vibrate(15);
    showToast(`${TYPES[type].label} logged at ${fmtTime(when)}`);
    render();
  }
  function showToast(msg, undo = true) {
    $('toastMsg').textContent = msg;
    $('undoBtn').style.display = undo ? '' : 'none';
    $('toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $('toast').classList.remove('show'), 4000);
  }
  $('undoBtn').onclick = () => {
    entries = entries.filter(x => x.id !== lastAdded); save();
    $('toast').classList.remove('show'); render();
  };

  let pendingType = null;
  document.querySelectorAll('.big').forEach(b => b.onclick = () => {
    const type = b.dataset.type;
    if (sameDay(selected, new Date())) { addEntry(type, new Date()); return; }
    // Logging on another day: ask for the time.
    pendingType = type;
    $('timeTitle').textContent = `${TYPES[type].label} on ${selected.toLocaleDateString([], { month: 'short', day: 'numeric' })}`;
    const now = new Date();
    $('timeInput').value = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
    $('timeSheet').classList.add('show');
  });
  $('timeCancel').onclick = () => $('timeSheet').classList.remove('show');
  $('timeSave').onclick = () => {
    const [h, m] = ($('timeInput').value || '12:00').split(':').map(Number);
    const when = new Date(selected.getFullYear(), selected.getMonth(), selected.getDate(), h, m);
    $('timeSheet').classList.remove('show');
    addEntry(pendingType, when);
  };

  // ---------- editing ----------
  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  let editingId = null;
  function openEdit(id) {
    const e = entries.find(x => x.id === id);
    if (!e) return;
    editingId = id;
    const d = new Date(e.t);
    $('editTitle').textContent = `${TYPES[e.type].label} · ${d.toLocaleDateString([], { month: 'short', day: 'numeric' })}`;
    $('editTime').value = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    $('editNote').value = e.note || '';
    $('editSheet').classList.add('show');
  }
  function closeEdit() { $('editSheet').classList.remove('show'); editingId = null; }
  $('editCancel').onclick = closeEdit;
  $('editSave').onclick = () => {
    const e = entries.find(x => x.id === editingId);
    if (e) {
      const d = new Date(e.t);
      if ($('editTime').value) {
        const [h, m] = $('editTime').value.split(':').map(Number);
        d.setHours(h, m, 0, 0);
        e.t = d.toISOString();
      }
      const note = $('editNote').value.trim();
      if (note) e.note = note; else delete e.note;
      save();
    }
    closeEdit(); render();
  };
  $('editDelete').onclick = () => {
    const e = entries.find(x => x.id === editingId);
    if (e && confirm(`Delete ${TYPES[e.type].label} at ${fmtTime(new Date(e.t))}?`)) {
      entries = entries.filter(x => x.id !== editingId); save(); closeEdit(); render();
    }
  };

  // Tap the dimmed background to close any sheet.
  document.querySelectorAll('.sheet-bg').forEach(bg => bg.addEventListener('click', ev => {
    if (ev.target === bg) { bg.classList.remove('show'); if (bg.id === 'editSheet') editingId = null; }
  }));

  // ---------- summary ----------
  let range = 1;            // months per window: 1, 3 or 12
  let endOffset = 0;        // 0 = window ends with the current month; -1 = one window earlier, etc.
  let pickedBar = null;
  const monthName = (d, opts) => d.toLocaleDateString([], opts);

  function windowBounds() {
    const now = new Date();
    const endMonth = new Date(now.getFullYear(), now.getMonth() + endOffset * range, 1);
    const start = new Date(endMonth.getFullYear(), endMonth.getMonth() - range + 1, 1);
    const end = new Date(endMonth.getFullYear(), endMonth.getMonth() + 1, 1); // exclusive
    return { start, end, endMonth };
  }
  function inRange(e, start, end) { const d = new Date(e.t); return d >= start && d < end; }
  function stats(start, end) {
    const list = entries.filter(e => inRange(e, start, end));
    const days = { migraine: new Set(), zolmi: new Set(), advil: new Set() };
    const doses = { migraine: 0, zolmi: 0, advil: 0 };
    for (const e of list) { days[e.type].add(dayKey(new Date(e.t))); doses[e.type]++; }
    return { list, days, doses };
  }
  function periodLabel(start, endMonth) {
    if (range === 1) return monthName(start, { month: 'long', year: 'numeric' });
    const sameYear = start.getFullYear() === endMonth.getFullYear();
    return `${monthName(start, sameYear ? { month: 'short' } : { month: 'short', year: 'numeric' })} – ${monthName(endMonth, { month: 'short', year: 'numeric' })}`;
  }
  const TOD = [
    ['Morning', '5am–noon', h => h >= 5 && h < 12],
    ['Afternoon', 'noon–5pm', h => h >= 12 && h < 17],
    ['Evening', '5–9pm', h => h >= 17 && h < 21],
    ['Night', '9pm–5am', h => h >= 21 || h < 5],
  ];

  function renderSummary() {
    const { start, end, endMonth } = windowBounds();
    const today = new Date();
    const st = stats(start, end);
    $('sLabel').textContent = periodLabel(start, endMonth);
    $('sNext').disabled = endOffset >= 0;

    const migDays = st.days.migraine.size;
    $('tMig').textContent = migDays;
    $('tMigS').textContent = migDays === 1 ? 'day' : 'days';
    $('tZol').textContent = st.days.zolmi.size;
    $('tZolS').textContent = `days · ${st.doses.zolmi} dose${st.doses.zolmi === 1 ? '' : 's'}`;
    $('tAdv').textContent = st.days.advil.size;
    $('tAdvS').textContent = `days · ${st.doses.advil} dose${st.doses.advil === 1 ? '' : 's'}`;

    // Days elapsed in the window (don't count the future)
    const lastDay = end > today ? new Date(today.getFullYear(), today.getMonth(), today.getDate() + 1) : end;
    const elapsed = Math.max(0, Math.round((lastDay - start) / 86400000));

    // Longest migraine-free stretch within the window (up to today)
    let best = 0, run = 0;
    for (let d = new Date(start); d < lastDay; d.setDate(d.getDate() + 1)) {
      if (st.days.migraine.has(dayKey(d))) run = 0; else best = Math.max(best, ++run);
    }
    // Current streak since last migraine (any time)
    const migs = entries.filter(e => e.type === 'migraine').map(e => new Date(e.t)).sort((a, b) => b - a);
    let since = '—';
    if (migs.length) {
      const a = new Date(migs[0].getFullYear(), migs[0].getMonth(), migs[0].getDate());
      const b = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      const n = Math.round((b - a) / 86400000);
      since = n === 0 ? 'Today' : `${n} day${n === 1 ? '' : 's'} ago`;
    }
    // Treated migraine days: a migraine day where a medicine was also logged
    const treated = [...st.days.migraine].filter(k => st.days.zolmi.has(k) || st.days.advil.has(k)).length;

    const facts = [
      ['Last migraine', since],
      ['Migraine-free days', elapsed ? `${elapsed - migDays} of ${elapsed}` : '—'],
      ['Longest migraine-free stretch', elapsed ? `${best} day${best === 1 ? '' : 's'}` : '—'],
      ['Migraine days with medicine', migDays ? `${treated} of ${migDays}` : '—'],
    ];
    if (range > 1) facts.splice(1, 0, ['Average per month', `${(migDays / range).toFixed(1)} migraine days`]);
    $('facts').innerHTML = facts.map(([k, v]) => `<div class="fact"><span>${k}</span><span>${v}</span></div>`).join('');

    // Medication-overuse reminder (monthly view only)
    const warns = [];
    if (range === 1) {
      if (st.days.zolmi.size >= 10) warns.push(`Zolmitriptan was taken on ${st.days.zolmi.size} days this month. Using triptans on 10 or more days a month can lead to medication-overuse headaches — worth mentioning to your doctor.`);
      if (st.days.advil.size >= 15) warns.push(`Advil was taken on ${st.days.advil.size} days this month. Using it on 15 or more days a month can lead to medication-overuse headaches — worth mentioning to your doctor.`);
    }
    $('warnBox').innerHTML = warns.map(w => `<div class="warn">⚠️ ${w}</div>`).join('');

    // Bar chart: 12 months ending at the window's last month
    const months = [];
    for (let i = 11; i >= 0; i--) {
      const m0 = new Date(endMonth.getFullYear(), endMonth.getMonth() - i, 1);
      const m1 = new Date(m0.getFullYear(), m0.getMonth() + 1, 1);
      months.push({ m0, n: stats(m0, m1).days.migraine.size, inWin: m0 >= start });
    }
    const max = Math.max(4, ...months.map(m => m.n));
    const peak = Math.max(...months.map(m => m.n));
    $('bars').innerHTML = months.map((m, i) => {
      const showLab = (pickedBar === i) || (pickedBar === null && (i === 11 || (m.n === peak && peak > 0)));
      return `<div class="col${m.inWin ? '' : ' dim'}${pickedBar === i ? ' picked' : ''}" data-i="${i}">
        ${showLab ? `<div class="lab">${m.n}</div>` : ''}
        <div class="b" style="height:${m.n ? Math.max(3, (m.n / max) * 100) : 0}%"></div></div>`;
    }).join('');
    $('xlabels').innerHTML = months.map(m => `<div>${monthName(m.m0, { month: 'narrow' })}</div>`).join('');
    $('barCap').textContent = pickedBar === null ? 'Tap a bar for details'
      : `${monthName(months[pickedBar].m0, { month: 'long', year: 'numeric' })}: ${months[pickedBar].n} migraine day${months[pickedBar].n === 1 ? '' : 's'}`;
    $('bars').querySelectorAll('.col').forEach(c => c.onclick = () => {
      const i = +c.dataset.i; pickedBar = pickedBar === i ? null : i; renderSummary();
    });

    // Time of day
    const migEntries = st.list.filter(e => e.type === 'migraine');
    const tod = TOD.map(([name, span, test]) => [name, span, migEntries.filter(e => test(new Date(e.t).getHours())).length]);
    const tmax = Math.max(1, ...tod.map(t => t[2]));
    $('tod').innerHTML = migEntries.length
      ? tod.map(([name, span, n]) => `<div class="hrow" title="${span}"><span>${name}</span>
          <div class="track"><div class="fill" style="width:${(n / tmax) * 100}%"></div></div><span>${n}</span></div>`).join('')
        + `<div class="muted">Morning 5am–noon · Afternoon noon–5pm · Evening 5–9pm · Night 9pm–5am</div>`
      : '<div class="muted">No migraines logged in this period.</div>';

    // Notes
    const withNotes = st.list.filter(e => e.note).sort((a, b) => b.t.localeCompare(a.t));
    $('notesList').innerHTML = withNotes.length
      ? withNotes.map(e => { const d = new Date(e.t); return `<div class="note-item">
          <div class="meta"><i class="dot ${e.type}"></i>${TYPES[e.type].label} · ${d.toLocaleDateString([], { month: 'short', day: 'numeric' })}, ${fmtTime(d)}</div>
          <div class="txt">${escapeHtml(e.note)}</div></div>`; }).join('')
      : '<div class="muted">No notes in this period. Tap a logged entry on the Log tab to add one.</div>';
  }

  function summaryText() {
    const { start, end, endMonth } = windowBounds();
    const st = stats(start, end);
    const lines = [`Migraine summary: ${periodLabel(start, endMonth)}`, '',
      `Migraine days: ${st.days.migraine.size}${range > 1 ? ` (avg ${(st.days.migraine.size / range).toFixed(1)}/month)` : ''}`,
      `Zolmitriptan: ${st.doses.zolmi} doses on ${st.days.zolmi.size} days`,
      `Advil: ${st.doses.advil} doses on ${st.days.advil.size} days`, '', 'Log:'];
    const byDate = {};
    for (const e of st.list.slice().sort((a, b) => a.t.localeCompare(b.t))) {
      const d = new Date(e.t);
      const k = d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
      (byDate[k] ||= []).push(`${TYPES[e.type].label} ${fmtTime(d)}${e.note ? ` (${e.note})` : ''}`);
    }
    const keys = Object.keys(byDate);
    if (!keys.length) lines.push('Nothing logged.');
    for (const k of keys) lines.push(`${k}: ${byDate[k].join('; ')}`);
    return lines.join('\n');
  }
  $('shareBtn').onclick = async () => {
    const text = summaryText();
    if (navigator.share) { try { await navigator.share({ title: 'Migraine summary', text }); return; } catch (err) { if (err.name === 'AbortError') return; } }
    try { await navigator.clipboard.writeText(text); showToast('Summary copied', false); } catch { alert(text); }
  };

  $('rangeSeg').querySelectorAll('button').forEach(b => b.onclick = () => {
    range = +b.dataset.r; endOffset = 0; pickedBar = null;
    $('rangeSeg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    renderSummary();
  });
  $('sPrev').onclick = () => { endOffset--; pickedBar = null; renderSummary(); };
  $('sNext').onclick = () => { if (endOffset < 0) { endOffset++; pickedBar = null; renderSummary(); } };

  function showTab(name) {
    const sum = name === 'summary';
    $('logView').hidden = sum; $('summaryView').hidden = !sum;
    $('tabLog').classList.toggle('on', !sum); $('tabSummary').classList.toggle('on', sum);
    window.scrollTo(0, 0);
    if (sum) renderSummary(); else render();
  }
  $('tabLog').onclick = () => showTab('log');
  $('tabSummary').onclick = () => showTab('summary');

  // ---------- navigation ----------
  function goMonth(delta) {
    const d = new Date(viewYear, viewMonth + delta, 1);
    viewYear = d.getFullYear(); viewMonth = d.getMonth(); render();
  }
  function goToday() {
    selected = new Date(); viewYear = selected.getFullYear(); viewMonth = selected.getMonth(); render();
  }
  $('prev').onclick = () => goMonth(-1);
  $('next').onclick = () => goMonth(1);
  $('todayBtn').onclick = goToday;

  // Swipe left/right on the calendar to change months.
  let sx = null;
  $('grid').addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
  $('grid').addEventListener('touchend', e => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 60) goMonth(dx < 0 ? 1 : -1);
  });

  // Always come back to today when the app is reopened.
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) hiddenAt = Date.now();
    else if (Date.now() - hiddenAt > 10 * 60 * 1000) { showTab('log'); goToday(); }
    else render();
  });

  // ---------- backup ----------
  $('backupBtn').onclick = () => $('backupSheet').classList.add('show');
  $('backupClose').onclick = () => $('backupSheet').classList.remove('show');
  $('exportBtn').onclick = async () => {
    const name = `migraine-backup-${dayKey(new Date())}.json`;
    const blob = new Blob([JSON.stringify({ app: 'migraine-log', version: 1, entries }, null, 2)], { type: 'application/json' });
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Migraine backup' }); return; } catch (err) { if (err.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  };
  $('importBtn').onclick = () => $('importFile').click();
  $('importFile').onchange = async ev => {
    const f = ev.target.files[0]; ev.target.value = '';
    if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      const incoming = Array.isArray(data) ? data : data.entries;
      if (!Array.isArray(incoming)) throw new Error('bad file');
      const valid = incoming.filter(e => e && TYPES[e.type] && !isNaN(Date.parse(e.t)) && e.id
        && (e.note === undefined || typeof e.note === 'string'));
      const ids = new Set(entries.map(e => e.id));
      const added = valid.filter(e => !ids.has(e.id));
      entries = entries.concat(added); save(); render();
      $('backupSheet').classList.remove('show');
      showToast(`Restored ${added.length} entr${added.length === 1 ? 'y' : 'ies'}`, false);
    } catch { alert("That file doesn't look like a migraine backup."); }
  };

  render();

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
